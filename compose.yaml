name: paguessr

services:
  postgres:
    image: postgres:16-alpine
    container_name: paguessr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-paguessr}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./apps/api/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-paguessr}']
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    container_name: paguessr-api
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 3333
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-paguessr}}
      NODE_ENV: ${NODE_ENV:-production}
      GOOGLE_STREET_VIEW_API_KEY: ${GOOGLE_STREET_VIEW_API_KEY:-}
      GOOGLE_MAPS_BROWSER_KEY: ${GOOGLE_MAPS_BROWSER_KEY:-}
      STREETVIEW_PANORAMA_ENABLED: ${STREETVIEW_PANORAMA_ENABLED:-false}
      STREETVIEW_PANORAMA_MONTHLY_BUDGET: ${STREETVIEW_PANORAMA_MONTHLY_BUDGET:-4500}
      ADMIN_NICKS: ${ADMIN_NICKS:-}
      CHAMPIONSHIPS_MODE: ${CHAMPIONSHIPS_MODE:-public}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    container_name: paguessr-web
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_UMAMI_SCRIPT_URL: ${VITE_UMAMI_SCRIPT_URL:-}
        VITE_UMAMI_WEBSITE_ID: ${VITE_UMAMI_WEBSITE_ID:-}
    restart: unless-stopped
    depends_on:
      - api

volumes:
  postgres_data:
